<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réservation de terrain</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23E30513%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2716%27 fill=%27%23FFC103%27/%3E%3C/svg%3E">
<meta name="theme-color" content="#E30513">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Mise en page : bandeau rouge UL, formulaire de réservation à gauche, cartes à droite (empilés sur cell) */
:root{
  --rouge:#E30513; --rouge-fonce:#A6000E; --or:#FFC103; --or-fonce:#C99400;
  --fond:#F3F1EE; --surface:#FFFFFF; --surface-2:#F7F5F2; --texte:#1E1B19; --texte-2:#5E5853;
  --ligne:#DDD7D1; --or-pale:#FFF4CC;
  --dispo:rgba(255,193,3,.5); --dispo-bord:rgba(201,148,0,.65);
  --indispo:rgba(227,5,19,.5); --indispo-bord:rgba(166,0,14,.55);
  --sur-rouge:#FFFFFF;
  --f-titre:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-texte:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --fond:#171413; --surface:#221E1C; --surface-2:#2B2624; --texte:#F2EDE9; --texte-2:#B4ABA4;
  --ligne:#3A3330; --or-pale:#3B3112; --rouge-fonce:#C2121F;
  --dispo:rgba(255,193,3,.38); --dispo-bord:rgba(255,193,3,.6);
  --indispo:rgba(227,5,19,.42); --indispo-bord:rgba(255,90,100,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --fond:#171413; --surface:#221E1C; --surface-2:#2B2624; --texte:#F2EDE9; --texte-2:#B4ABA4;
  --ligne:#3A3330; --or-pale:#3B3112; --rouge-fonce:#C2121F;
  --dispo:rgba(255,193,3,.38); --dispo-bord:rgba(255,193,3,.6);
  --indispo:rgba(227,5,19,.42); --indispo-bord:rgba(255,90,100,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:var(--f-texte);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 90px}
button,select{font-family:inherit}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}

header{background:var(--rouge);color:var(--sur-rouge);border-bottom:5px solid var(--or);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 14px}
.entete{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-family:var(--f-titre);font-size:1.9rem;letter-spacing:.5px;line-height:1}
header p{margin:4px 0 0;font-size:.92rem;opacity:.92}
.sync{font-size:.8rem;background:rgba(0,0,0,.18);border-radius:999px;padding:4px 10px;white-space:nowrap}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--or);margin-right:6px;vertical-align:1px}
.sync.local::before{background:#fff;opacity:.6}

.page{max-width:1360px;margin:0 auto;padding-top:18px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:start}
.barre{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.legende{display:flex;flex-wrap:wrap;gap:12px;font-size:.85rem;color:var(--texte-2)}
.legende span{display:inline-flex;align-items:center;gap:6px}
.pas{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px solid var(--ligne)}
.bascule{display:inline-flex;background:var(--surface);border:1px solid var(--ligne);border-radius:999px;padding:3px}
.bascule button{border:none;background:transparent;color:var(--texte-2);font-weight:600;font-size:.85rem;padding:6px 12px;border-radius:999px;cursor:pointer}
.bascule button[aria-pressed="true"]{background:var(--rouge);color:var(--sur-rouge)}
.lien{border:none;background:none;color:var(--texte-2);font-size:.82rem;text-decoration:underline;cursor:pointer;padding:6px}

/* Colonne de gauche : panneau à planifier + bouton réservation */
.colonne-gauche{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.btn-resa{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);color:var(--texte);border:1px solid var(--ligne);border-left:5px solid var(--rouge);border-radius:0 12px 12px 0;
  padding:10px 12px;font-size:.9rem;font-weight:700;font-family:inherit}
.btn-resa:hover{background:var(--or-pale)}
.btn-resa small{display:block;font-weight:400;font-size:.76rem;color:var(--texte-2)}
.btn-resa .ico{font-size:1.3rem}
/* Panneau à planifier */
.aplanifier{background:var(--surface);border:1px solid var(--ligne);border-top:4px solid var(--or);
  border-radius:0 0 12px 12px;padding:12px;outline:3px dashed transparent;outline-offset:2px}
.aplanifier.survol{outline-color:var(--rouge)}
.aplanifier h2{margin:0;font-family:var(--f-titre);font-size:1.15rem;color:var(--rouge);letter-spacing:.3px}
.aplanifier .petit{font-size:.78rem;color:var(--texte-2);margin:2px 0 10px}
#listeAPlanifier{display:flex;flex-direction:column;gap:8px}
.carte-match{background:var(--surface);border:2px solid var(--rouge);box-shadow:0 0 0 2px var(--or) inset;border-radius:10px;
  padding:7px 10px;cursor:grab;font-size:.8rem;line-height:1.3;user-select:none;-webkit-user-select:none;color:var(--texte-2);text-align:left;width:100%}
.carte-match b{display:block;color:var(--texte);font-size:.9rem}
.carte-match.choisi{background:var(--or-pale);transform:scale(1.02)}
.carte-match{position:relative;padding-right:34px}
.carte-match .suppr{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;
  border:1px solid var(--ligne);background:var(--surface-2);color:var(--texte-2);cursor:pointer;font-size:.75rem;padding:0}
.ajouter{width:100%;margin-bottom:10px;border:2px dashed var(--rouge);border-radius:10px;background:transparent;color:var(--rouge);
  font-weight:700;font-size:.88rem;padding:8px;cursor:pointer}
.ajouter:hover{background:var(--or-pale)}
.dialogue label{display:block;font-size:.82rem;font-weight:700;color:var(--texte-2);margin-bottom:4px}
.dialogue select{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--ligne);background:var(--surface-2);color:var(--texte);margin-bottom:12px}
.dialogue .vs{text-align:center;font-family:var(--f-titre);font-size:1.1rem;color:var(--rouge);margin:-4px 0 6px}
.dialogue .erreur{color:var(--rouge);font-size:.85rem;margin:-4px 0 10px}
.vide{font-size:.82rem;color:var(--texte-2);text-align:center;padding:6px 0}

/* Vue détaillée */
.semaine{margin-top:20px}
.semaine h3{margin:0 0 8px;font-family:var(--f-titre);font-size:1.25rem;color:var(--rouge);letter-spacing:.3px}
.grille{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.jour{background:var(--surface);border:1px solid var(--ligne);border-radius:12px;overflow:hidden}
.jour h4{margin:0;padding:8px;font-size:.92rem;text-align:center;background:var(--rouge-fonce);color:var(--sur-rouge);text-transform:capitalize}
.jour.passe{opacity:.5}
.plages{padding:10px;display:flex;flex-direction:column;gap:10px}
.bulle{position:relative;border-radius:16px;padding:12px 10px 10px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;
  border:2px dashed var(--ligne);background:var(--surface-2);color:var(--texte-2);min-height:82px;
  outline:3px dashed transparent;outline-offset:2px;transition:transform .1s}
.bulle .heure{font-family:var(--f-titre);font-size:1.35rem;font-weight:700;color:var(--texte);font-variant-numeric:tabular-nums}
.bulle .statut{font-size:.82rem}
.bulle .note{font-size:.8rem;margin-top:4px;font-weight:700;color:var(--texte);word-break:break-word}
.bulle.dispo{background:var(--dispo);border:2px solid var(--dispo-bord)}
.bulle.nondispo{background:var(--indispo);border:2px solid var(--indispo-bord)}
.bulle.dispo .statut,.bulle.nondispo .statut{color:var(--texte)}
.bulle.match{background:var(--surface);border:3px solid var(--rouge);box-shadow:0 0 0 3px var(--or) inset;cursor:grab}
.bulle.match .statut{color:var(--rouge);font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:.75rem}
.bulle.survol,.cible .bulle:not(.match){outline-color:var(--rouge)}
.bulle.choisi{transform:scale(1.03);background:var(--or-pale)}
.bulle .coin{position:absolute;top:5px;right:6px;border:none;background:var(--surface);color:var(--texte);border-radius:50%;
  width:28px;height:28px;cursor:pointer;font-size:.8rem;padding:0;opacity:.85}
.terrain{margin-top:7px;font-size:.8rem;font-weight:700;border:1.5px solid var(--rouge-fonce);border-radius:6px;padding:3px 6px;cursor:pointer;
  background:var(--or-pale);color:var(--texte);max-width:100%}
.terrain.choisi{background:var(--rouge-fonce);color:#fff}

/* Vue compacte (widget) */
.compact .semaine{background:var(--surface);border:1px solid var(--ligne);border-radius:12px;padding:12px;margin-top:12px}
.compact .semaine h3{font-size:1.05rem;margin-bottom:6px}
.mini{display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr));gap:6px;align-items:center;font-size:.78rem;color:var(--texte-2)}
.mini .tete{text-align:center;font-weight:700;color:var(--texte)}
.mini .tete small{display:block;font-weight:400;color:var(--texte-2)}
.mini .heure{font-variant-numeric:tabular-nums}
.case{height:40px;border-radius:9px;border:1.5px dashed var(--ligne);background:var(--surface-2);cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--texte);line-height:1.05;overflow:hidden}
.case.dispo{background:var(--dispo);border:1.5px solid var(--dispo-bord)}
.case.nondispo{background:var(--indispo);border:1.5px solid var(--indispo-bord)}
.case.match{background:var(--surface);border:2px solid var(--rouge);box-shadow:0 0 0 2px var(--or) inset;color:var(--rouge)}
.case.passe{opacity:.45}
.case.choisi{outline:3px solid var(--or);outline-offset:1px}
.cible .case:not(.match){outline:2px dashed var(--rouge);outline-offset:1px}
.prochain{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--rouge);border-radius:12px;padding:10px 12px;margin-top:4px}
.prochain .date{text-align:center;min-width:46px;font-size:.75rem;color:var(--texte-2);text-transform:capitalize}
.prochain .date b{display:block;font-family:var(--f-titre);font-size:1.8rem;line-height:1;color:var(--texte)}
.prochain .quoi{flex:1;min-width:0}
.prochain .quoi b{display:block;font-size:1rem}
.prochain .quoi span{font-size:.82rem;color:var(--texte-2)}
.pastille-terrain{background:var(--rouge-fonce);color:#fff;font-size:.78rem;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap}
.pastille-terrain.vide{background:transparent;color:var(--texte-2);border:1px dashed var(--ligne)}

.bas{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:24px}
.aide{font-size:.84rem;color:var(--texte-2);max-width:540px;margin:0;line-height:1.5}
.equipes{margin-left:auto;background:var(--surface);border:1px solid var(--ligne);border-top:4px solid var(--rouge);border-radius:0 0 10px 10px;
  padding:10px 14px;font-size:.78rem;line-height:1.55}
.equipes h2{margin:0 0 4px;font-family:var(--f-titre);font-size:1rem;color:var(--rouge)}
.equipes ul{list-style:none;margin:0;padding:0}
.equipes li{color:var(--texte-2)}
.equipes b{color:var(--texte)}
.equipes li.nous{background:var(--or-pale);border-radius:4px;padding:0 4px;margin:0 -4px}

/* Bandeau de placement + dialogue */
.placement{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--texte);color:var(--fond);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between}
.placement button{border:none;border-radius:999px;padding:8px 14px;font-weight:700;background:var(--or);color:#1E1B19;cursor:pointer}
.voile{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dialogue{background:var(--surface);color:var(--texte);border-radius:14px;border-top:5px solid var(--rouge);padding:18px;width:min(420px,100%)}
.dialogue h2{margin:0 0 6px;font-family:var(--f-titre);font-size:1.3rem}
.dialogue p{margin:0 0 12px;color:var(--texte-2);font-size:.92rem}
.dialogue input{width:100%;font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--ligne);background:var(--surface-2);color:var(--texte);margin-bottom:12px}
.dialogue .boutons{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dialogue button{border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;border:1px solid var(--ligne);background:var(--surface);color:var(--texte)}
.dialogue button.ok{background:var(--rouge);border-color:var(--rouge);color:#fff}

.haut-droite{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.verrou{border:1.5px solid rgba(255,255,255,.7);background:transparent;color:var(--sur-rouge);border-radius:999px;
  padding:5px 12px;font-weight:700;font-size:.82rem;cursor:pointer}
.verrou:hover{background:rgba(0,0,0,.15)}
body.lecture .coin,body.lecture .suppr,body.lecture .ajouter{display:none}
body.lecture .bulle,body.lecture .case,body.lecture .carte-match{cursor:default}
body.lecture .carte-match{padding-right:10px}
.message{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;
  background:var(--texte);color:var(--fond);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:min(92vw,460px);text-align:center}
/* Vue Réservation de terrain */
.resa{max-width:1100px;margin:0 auto;padding-top:16px}
.resa-tete{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.resa-tete h2{margin:0;font-family:var(--f-titre);font-size:1.7rem;color:var(--rouge);letter-spacing:.3px}
.retour{border:1.5px solid var(--rouge);background:var(--surface);color:var(--rouge);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;cursor:pointer}
.retour:hover{background:var(--or-pale)}
.resa-grille{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;margin-top:14px;align-items:start}
.carte{background:var(--surface);border:1px solid var(--ligne);border-top:4px solid var(--rouge);border-radius:0 0 12px 12px;padding:16px}
.carte h3{margin:0 0 12px;font-family:var(--f-titre);font-size:1.25rem;color:var(--rouge);letter-spacing:.3px}
.champs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.champ{display:flex;flex-direction:column;gap:4px;min-width:0}
.champ.large{grid-column:1 / -1}
.champ label{font-size:.8rem;font-weight:700;color:var(--texte-2)}
.champ input,.champ select,.champ textarea{width:100%;font:inherit;font-size:16px;padding:9px 10px;border-radius:8px;border:1px solid var(--ligne);background:var(--surface-2);color:var(--texte)}
.champ textarea{resize:vertical;min-height:44px}
.puces{display:flex;gap:6px;flex-wrap:wrap}
.puces button{border:1px solid var(--ligne);background:var(--surface-2);color:var(--texte);border-radius:999px;padding:5px 10px;font-size:.82rem;font-weight:700;cursor:pointer}
.puces button:hover{border-color:var(--rouge)}
.puces.jours{flex-wrap:nowrap}
.puces.jours button{white-space:nowrap}
.puces.jours .court{display:none}
@media (max-width:440px){
  .puces.jours{gap:4px}
  .puces.jours button{flex:1 1 auto;padding:5px 6px}
  .puces.jours .long{display:none}
  .puces.jours .court{display:inline}
}
.lien-auto{align-self:flex-start;border:none;background:none;color:var(--rouge);font-size:.8rem;font-weight:700;text-decoration:underline;cursor:pointer;padding:2px 0}
.ligne-fin{display:flex;flex-direction:column;gap:4px}
.ligne-fin input{width:100%}
.puces button[aria-pressed="true"]{border-color:var(--rouge);background:var(--rouge);color:#fff}
.joueurs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.choix-joueurs{display:flex;flex-wrap:wrap;gap:8px}
.choix-joueurs button{border:2px solid var(--ligne);background:var(--surface-2);color:var(--texte);border-radius:999px;
  padding:9px 16px;font-size:1rem;font-weight:700;cursor:pointer;min-width:72px}
.choix-joueurs button[aria-pressed="true"]{background:var(--rouge);border-color:var(--rouge);color:#fff}
.autre-joueur{display:flex;gap:8px;margin-top:8px}
.autre-joueur input{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border-radius:8px;border:1px solid var(--ligne);background:var(--surface-2);color:var(--texte)}
.autre-joueur button{border:1.5px solid var(--rouge);background:var(--surface);color:var(--rouge);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.retirer-membres{margin-top:8px;align-self:flex-start;border:1.5px dashed var(--rouge);background:transparent;color:var(--rouge);
  border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem;cursor:pointer}
.terrains-resa{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.terrains-resa .t{display:flex;flex-direction:column;gap:3px}
.terrains-resa .t span{font-size:.75rem;color:var(--texte-2);font-weight:700}
.terrains-resa select{width:100%;font:inherit;font-size:16px;padding:9px 10px;border-radius:8px;border:1px solid var(--ligne);background:var(--surface-2);color:var(--texte)}
.apercu{margin-top:14px;background:var(--surface-2);border:1px dashed var(--ligne);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:.92rem;line-height:1.45;word-break:break-word}
.apercu-titre{margin:14px 0 0;font-size:.8rem;font-weight:700;color:var(--texte-2)}
.actions-resa{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions-resa button{border-radius:999px;padding:10px 16px;font-weight:700;font-size:.92rem;cursor:pointer;border:1.5px solid var(--rouge);background:var(--surface);color:var(--rouge)}
.actions-resa button.principal{background:var(--rouge);color:#fff}
.erreur-resa{color:var(--rouge);font-size:.85rem;font-weight:700;margin:10px 0 0}
.liste-resa{display:flex;flex-direction:column;gap:10px}
/* Carte de réservation : même rendu que l'image copiée (échelle : largeur de l'image = 900 px) */
.item-resa{container-type:inline-size;background:#FFFFFF;color:#1E1B19;border-bottom:max(4px,.89cqw) solid #FFC103;
  box-shadow:0 1px 4px rgba(0,0,0,.18);overflow:hidden}
.cm-bandeau{background:#E30513;color:#fff;border-bottom:max(5px,1.11cqw) solid #FFC103;display:flex;align-items:center;justify-content:space-between;
  padding:max(10px,2.6cqw) max(14px,5.33cqw)}
.cm-titre{font-family:var(--f-titre);font-weight:700;font-size:max(1.4rem,6.44cqw);line-height:1}
.cm-icone svg{display:block;width:max(42px,11.5cqw);height:auto;margin:-1.5cqw 0}
.cm-corps{padding:max(12px,3.6cqw) max(14px,5.33cqw) max(14px,4cqw)}

<body>
<header>
  <div class="entete">
    <div>
      <h1>Réservation de terrain</h1>
      <p>Pickleball · lieux, terrains et joueurs</p>
    </div>
    <div class="haut-droite"><span class="sync local" id="sync">Connexion…</span><button class="verrou" id="btnVerrou" type="button">🔒 Modifier</button></div>
  </div>
</header>

<div class="resa" id="vueResa">
  <div class="resa-grille">
    <section class="carte">
      <h3>Nouvelle réservation</h3>
      <div class="champs">
        <div class="champ large">
          <label for="resaDate">Date</label>
          <input id="resaDate" type="date">
          <div class="puces jours"><button type="button" data-jour="0">Aujourd'hui</button><button type="button" data-jour="1"></button><button type="button" data-jour="2"></button><button type="button" data-jour="3"></button></div>
        </div>
        <div class="champ">
          <label for="resaHeure">Début</label>
          <input id="resaHeure" type="time" step="300">
          <div class="puces"><button type="button" data-heure="12:15">12 h 15</button><button type="button" data-heure="16:30">16 h 30</button></div>
        </div>
        <div class="champ">
          <label for="resaFin">Fin (1 h par défaut, ajustable)</label>
          <div class="ligne-fin">
            <input id="resaFin" type="time" step="300">
            <div class="puces"><button type="button" data-duree="60">1 h</button><button type="button" data-duree="90">1 h 30</button><button type="button" data-duree="120">2 h</button></div>
          </div>
        </div>
        <div class="champ large">
          <label for="resaLieu">Lieu</label>
          <select id="resaLieu"></select>
        </div>
        <div class="champ large">
          <label id="resaJoueursTitre">Joueurs</label>
          <div class="choix-joueurs" id="resaJoueurs"></div>
          <div class="autre-joueur seul-edition">
            <input id="resaAutre" type="text" placeholder="Nouveau membre" autocomplete="off" aria-label="Nouveau membre">
            <button type="button" id="resaAjouterAutre">Ajouter à la liste</button>
          </div>
          <button type="button" class="retirer-membres seul-edition" id="resaRetirer" hidden></button>
        </div>
        <div class="champ large">
          <label>Terrains</label>
          <div class="terrains-resa" id="resaTerrains"></div>
        </div>
        <div class="champ large">
          <label for="resaNote">Note</label>
          <textarea id="resaNote" rows="2" placeholder="Ex. : apportez des balles"></textarea>
          <button type="button" class="lien-auto" id="resaNoteAuto" hidden>↺ Remettre le texte automatique</button>
        </div>
      </div>
      <p class="erreur-resa" id="resaErreur" hidden></p>
      <div class="actions-resa">
        <button class="principal" id="resaEnregistrer" type="button">Enregistrer la réservation</button>
        <button id="resaVider" type="button">Recommencer</button>
      </div>
    </section>
    <section class="carte">
      <h3>Réservations à venir</h3>
      <p class="indice-copie">📋 Touche une carte pour copier son image.</p>
      <div id="resaApercuCarte"></div>
      <div class="liste-resa" id="listeResa"></div>
    </section>
  </div>
</div>

<div class="message" id="message" role="status" hidden></div>

<div class="voile" id="voile" hidden>
  <div class="dialogue" role="dialog" aria-modal="true" aria-labelledby="dlgTitre">
    <h2 id="dlgTitre"></h2>
    <p id="dlgTexte"></p>
    <input id="dlgChamp" type="text" hidden>
    <div class="boutons">
      <button id="dlgAnnuler">Annuler</button>
      <button id="dlgOk" class="ok">OK</button>
    </div>
  </div>
</div>

<script>
/* ===================== ÉTAT ET STOCKAGE ===================== */
const CLE_LOCALE = "terrains-donnees-v1";
const clone = o => JSON.parse(JSON.stringify(o));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const aujourdhui = new Date(), isoAuj = iso(aujourdhui);
const depart = () => ({ membres: [...MEMBRES_DEPART], reservations: [] });
function lireLocal(){ try{ const d = JSON.parse(localStorage.getItem(CLE_LOCALE)); if(d && Array.isArray(d.reservations)) return d; }catch(e){} return null; }
function ecrireLocal(){ try{ localStorage.setItem(CLE_LOCALE, JSON.stringify(donnees)); }catch(e){} }
let donnees = null;   // rempli au démarrage, une fois les membres de départ connus

const API = "https://script.google.com/macros/s/AKfycby7XnZQ73kpNppjbsX3_bPiGtoFoN9mSObVpfUG7BzsyX_xt0iK7CdWD2hgb71v9A/exec";   // adresse /exec du script Google des réservations
const CLE_NIP = "terrains-nip";
let nip = null; try{ nip = localStorage.getItem(CLE_NIP); }catch(e){}
let modeEdition = !!nip;
let versionServeur = 0;
let minuterie = null, envoiEnCours = false, aRenvoyer = false;

function majSync(texte, local){ const s = document.getElementById("sync"); s.textContent = texte; s.classList.toggle("local", !!local); }
function majVerrou(){
  document.body.classList.toggle("lecture", !modeEdition);
  document.getElementById("btnVerrou").textContent = modeEdition ? "🔓 Verrouiller" : "🔒 Modifier";
}
let minuterieMessage = null;
function message(texte){
  const m = document.getElementById("message");
  m.textContent = texte; m.hidden = false;
  clearTimeout(minuterieMessage); minuterieMessage = setTimeout(() => { m.hidden = true; }, 5000);
}

async function appelApi(corps){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(corps) });
  return r.json();
}

function sauver(){
  ecrireLocal();
  if(!modeEdition) return;
  aRenvoyer = true;
  clearTimeout(minuterie);
  minuterie = setTimeout(envoyer, 700);     // regroupe les clics rapides en un seul envoi
}

async function envoyer(){
  minuterie = null;
  if(envoiEnCours || !aRenvoyer || !modeEdition) return;
  envoiEnCours = true; aRenvoyer = false;
  majSync("Enregistrement…", true);
  try{
    const r = await appelApi({ action:"enregistrer", nip, donnees: clone(donnees), versionBase: versionServeur });
    if(r.ok){ versionServeur = r.version; majSync("Synchronisé"); }
    else if(r.erreur === "conflit"){
      versionServeur = r.version;
      if(r.donnees){ donnees = clone(r.donnees); ecrireLocal(); rendre(); }
      aRenvoyer = false;
      message("Quelqu'un d'autre venait de modifier. Ton dernier changement n'a pas été enregistré : refais-le.");
      majSync("Synchronisé");
    }
    else if(r.erreur === "nip"){ oublierNip(); message("Le NIP n'est plus valide. Entre-le de nouveau pour modifier."); majSync("Lecture seule", true); }
    else if(r.erreur === "bloque"){ aRenvoyer = true; message("Trop d'essais de NIP ratés. Réessaie dans 10 minutes."); majSync("Bloqué", true); }
    else { message("Enregistrement refusé (" + (r.erreur || "inconnu") + ")."); majSync("Erreur", true); }
  }catch(e){
    aRenvoyer = true;                          // on réessaiera au prochain rafraîchissement
    majSync("Hors ligne · non enregistré", true);
  }finally{
    envoiEnCours = false;
    if(aRenvoyer && !minuterie && navigator.onLine !== false) minuterie = setTimeout(envoyer, 15000);
  }
}

async function rafraichir(){
  if(minuterie || envoiEnCours || aRenvoyer){ if(aRenvoyer && !minuterie && !envoiEnCours) envoyer(); return; }
  try{
    const r = await (await fetch(API)).json();
    if(!r.ok) throw 0;
    if(minuterie || envoiEnCours || aRenvoyer) return;          // un changement local est parti entre-temps
    if(r.version !== versionServeur && r.donnees && Array.isArray(r.donnees.reservations)){
      versionServeur = r.version; donnees = clone(r.donnees); ecrireLocal(); rendre();
    }
    majSync(modeEdition ? "Synchronisé" : "Synchronisé · lecture seule", !modeEdition);
  }catch(e){ majSync("Hors ligne", true); }
}

function oublierNip(){ nip = null; modeEdition = false; try{ localStorage.removeItem(CLE_NIP); }catch(e){} majVerrou(); rendre(); }

async function deverrouiller(){
  const saisi = await dialogue({ titre:"Entrer le NIP", texte:"Le NIP permet de modifier les réservations et la liste des membres sur cet appareil. Il reste mémorisé ici.", champ:"password", ok:"Déverrouiller" });
  if(saisi === null || !saisi.trim()) return;
  try{
    const r = await appelApi({ action:"verifier", nip: saisi.trim() });
    if(r.ok){
      nip = saisi.trim(); modeEdition = true;
      try{ localStorage.setItem(CLE_NIP, nip); }catch(e){}
      majVerrou(); rendre(); message("Mode modification activé sur cet appareil.");
      rafraichir();
    } else if(r.erreur === "bloque") message("Trop d'essais ratés. Réessaie dans 10 minutes.");
    else message("NIP incorrect.");
  }catch(e){ message("Impossible de joindre le serveur. Vérifie ta connexion."); }
}
function exigerEdition(){ if(modeEdition) return true; deverrouiller(); return false; }

function brancherSynchro(){
  document.getElementById("btnVerrou").onclick = () => modeEdition ? oublierNip() : deverrouiller();
  majVerrou();
  rafraichir();
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") rafraichir(); });
  window.addEventListener("online", rafraichir);
  setInterval(() => { if(document.visibilityState === "visible") rafraichir(); }, 20000);
}

/* ===================== DIALOGUE MAISON ===================== */
function dialogue({ titre, texte, champ, valeur="", ok="OK", seulOk=false }){
  return new Promise(res => {
    const v = document.getElementById("voile"), inp = document.getElementById("dlgChamp");
    document.getElementById("dlgTitre").textContent = titre;
    document.getElementById("dlgTexte").textContent = texte || "";
    inp.hidden = !champ; inp.value = valeur;
    inp.type = champ === "password" ? "password" : "text";
    inp.inputMode = champ === "password" ? "numeric" : "text";
    inp.autocomplete = "off";
    document.getElementById("dlgOk").textContent = ok;
    document.getElementById("dlgAnnuler").hidden = seulOk;
    v.hidden = false;
    (champ ? inp : document.getElementById("dlgOk")).focus();
    const fin = r => { v.hidden = true; document.getElementById("dlgOk").onclick = document.getElementById("dlgAnnuler").onclick = null; inp.onkeydown = null; res(r); };
    document.getElementById("dlgOk").onclick = () => fin(champ ? inp.value : true);
    document.getElementById("dlgAnnuler").onclick = () => fin(champ ? null : false);
    inp.onkeydown = e => { if(e.key === "Enter") fin(inp.value); if(e.key === "Escape") fin(null); };
  });
}

/* ===================== RÉSERVATION DE TERRAIN ===================== */
/* Membres de départ : la vraie liste est enregistrée avec les données partagées (donnees.membres) */
const MEMBRES_DEPART = ["Ben", "Alex", "Kath", "Mike"];
/* Lieux et nombre de terrains */
const LIEUX = [ { nom:"EPS-STADE", terrains:12 }, { nom:"EPS-00141", terrains:3 }, { nom:"EPS-00143", terrains:3 } ];
const JOUEURS_PAR_TERRAIN = 4;
const JOURS_AVANCE = 3;   // on peut réserver jusqu'à 3 jours d'avance
/* Valeurs proposées à l'ouverture (tout reste modifiable) */
const DEFAUT = { jour: 0, heure: "12:15", lieu: "EPS-STADE", joueurs: ["Ben", "Alex", "Kath"] };   // jour : 0 = aujourd'hui, 1 = demain
const CLE_LIEU = "terrains-lieu";
const fmtLong = new Intl.DateTimeFormat("fr-CA",{ weekday:"long", day:"numeric", month:"long" });
const $ = id => document.getElementById(id);
const heureLisible = h => { const [hh, mm] = String(h || "").split(":"); return hh ? `${Number(hh)}\u00a0h\u00a0${mm}` : ""; };
function dateLisible(isoDate){
  if(!isoDate) return "";
  const [y,m,j] = isoDate.split("-").map(Number);
  const t = fmtLong.format(new Date(y, m-1, j));
  return t.charAt(0).toUpperCase() + t.slice(1);
}
const DUREE_DEFAUT = 60;   // minutes
function ajouterMinutes(h, min){
  const [hh, mm] = h.split(":").map(Number), t = (hh * 60 + mm + min + 1440) % 1440;
  return String(Math.floor(t / 60)).padStart(2,"0") + ":" + String(t % 60).padStart(2,"0");
}
function minutesEntre(a, b){
  const [ah, am] = a.split(":").map(Number), [bh, bm] = b.split(":").map(Number);
  return (bh * 60 + bm) - (ah * 60 + am);
}
function plageHoraire(h, fin){
  if(!h) return "";
  return `${heureLisible(h)} à ${heureLisible(fin || ajouterMinutes(h, DUREE_DEFAUT))}`;
}
let dureeChoisie = DUREE_DEFAUT;   // null = fin ajustée à la main
function majFinAuto(){
  const h = $("resaHeure").value, f = $("resaFin").value;
  if(!dureeChoisie && h && f && minutesEntre(h, f) <= 0) dureeChoisie = DUREE_DEFAUT;   // fin manuelle devenue avant le début : on revient à 1 h
  if(h && dureeChoisie) $("resaFin").value = ajouterMinutes(h, dureeChoisie);
  if(!h && dureeChoisie) $("resaFin").value = "";
}
const listeFr = a => a.length <= 1 ? (a[0] || "") : a.slice(0, -1).join(", ") + " et " + a[a.length - 1];
const membres = () => Array.isArray(donnees.membres) ? donnees.membres : MEMBRES_DEPART;
const lieuChoisi = () => LIEUX.find(l => l.nom === $("resaLieu").value);
const nbTerrains = () => Math.max(1, Math.ceil(joueursChoisis.length / JOUEURS_PAR_TERRAIN));
const texteTerrains = r => {
  const t = (Array.isArray(r.terrains) ? r.terrains : [r.terrain]).filter(Boolean).sort((a, b) => Number(a) - Number(b));
  return t.length ? (t.length > 1 ? "Terrains #" : "Terrain #") + listeFr(t).replace(/, /g, ", #").replace(/ et /, " et #") : "";
};
let joueursChoisis = [], terrainsChoisis = [];
/* Note automatique selon le nombre de joueurs (tant qu'on ne la modifie pas à la main) */
let noteAuto = true;
function texteNoteAuto(n){
  if(!n) return "";
  const manque = (JOUEURS_PAR_TERRAIN - n % JOUEURS_PAR_TERRAIN) % JOUEURS_PAR_TERRAIN;
  if(!manque) return "C'est complet !";
  return manque === 1
    ? "Nous sommes à la recherche d'un joueur.\nQuelqu'un de disponible pour se joindre à nous???"
    : `Nous sommes à la recherche de ${manque} joueurs.\nDes joueurs disponibles pour se joindre à nous???`;
}
function majNoteAuto(){
  if(noteAuto) $("resaNote").value = texteNoteAuto(joueursChoisis.length);
  $("resaNoteAuto").hidden = noteAuto;
}

function erreurResa(t){ const e = $("resaErreur"); e.textContent = t || ""; e.hidden = !t; }

function rendreTerrains(){
  const zone = $("resaTerrains"); zone.innerHTML = "";
  const lieu = lieuChoisi(), n = lieu ? Math.min(nbTerrains(), lieu.terrains) : 1;
  terrainsChoisis = terrainsChoisis.slice(0, n);
  for(let i = 0; i < n; i++){
    const box = document.createElement("label"); box.className = "t";
    box.innerHTML = `<span>${n > 1 ? "Terrain " + (i + 1) : "Numéro du terrain"}</span>`;
    const sel = document.createElement("select");
    sel.add(new Option(lieu ? "À préciser" : "Choisis le lieu", ""));
    if(lieu) for(let t = 1; t <= lieu.terrains; t++){
      const pris = terrainsChoisis.some((v, j) => j !== i && v === String(t));
      const o = new Option("Terrain #" + t + (pris ? " (déjà choisi)" : ""), String(t)); o.disabled = pris; sel.add(o);
    }
    sel.value = terrainsChoisis[i] || "";
    sel.onchange = () => { terrainsChoisis[i] = sel.value; erreurResa(""); rendreTerrains(); };
    box.appendChild(sel); zone.appendChild(box);
  }
  rendreApercu();
}

function rendreChoixJoueurs(){
  const liste = membres();
  joueursChoisis = joueursChoisis.filter(j => liste.includes(j));
  const zone = $("resaJoueurs"); zone.innerHTML = "";
  if(!liste.length) zone.innerHTML = `<div class="vide">La liste est vide. Ajoute un membre ci-dessous.</div>`;
  liste.forEach(nom => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = nom;
    b.setAttribute("aria-pressed", String(joueursChoisis.includes(nom)));
    b.onclick = () => basculerJoueur(nom);
    zone.appendChild(b);
  });
  const n = joueursChoisis.length, t = nbTerrains();
  $("resaJoueursTitre").textContent = n ? `Joueurs : ${n} choisi${n > 1 ? "s" : ""} · ${t} terrain${t > 1 ? "s" : ""}` : "Joueurs (touche pour choisir)";
  const btn = $("resaRetirer");
  btn.hidden = !n;
  btn.textContent = `Retirer ${listeFr(joueursChoisis)} de la liste`;
  majNoteAuto();
  rendreTerrains();
}

function basculerJoueur(nom){
  erreurResa("");
  const lieu = lieuChoisi();
  if(joueursChoisis.includes(nom)) joueursChoisis = joueursChoisis.filter(j => j !== nom);
  else if(lieu && joueursChoisis.length >= lieu.terrains * JOUEURS_PAR_TERRAIN){ erreurResa(`${lieu.nom} n'a que ${lieu.terrains} terrains.`); return; }
  else joueursChoisis.push(nom);
  rendreChoixJoueurs();
}

function ajouterMembre(){
  const nom = $("resaAutre").value.trim().replace(/\s+/g, " ");
  if(!nom) return;
  if(!exigerEdition()) return;
  const liste = [...membres()];
  if(liste.some(m => m.toLowerCase() === nom.toLowerCase())){ erreurResa(`${nom} est déjà dans la liste.`); return; }
  liste.push(nom);
  donnees.membres = liste;
  $("resaAutre").value = "";
  sauver(); rendre();
  message(`${nom} a été ajouté à la liste.`);
}

async function retirerMembres(){
  if(!joueursChoisis.length || !exigerEdition()) return;
  const qui = listeFr(joueursChoisis);
  const ok = await dialogue({ titre:"Retirer de la liste pour de bon ?", texte:`${qui} ne sera plus proposé${joueursChoisis.length > 1 ? "s" : ""}. Les réservations déjà enregistrées ne changent pas.`, ok:"Retirer" });
  if(!ok) return;
  donnees.membres = membres().filter(m => !joueursChoisis.includes(m));
  joueursChoisis = [];
  sauver(); rendre();
  message(`${qui} : retiré${qui.includes(" et ") ? "s" : ""} de la liste.`);
}

function lireFormulaire(){
  const terrains = terrainsChoisis.filter(Boolean);
  return { date: $("resaDate").value, heure: $("resaHeure").value, fin: $("resaFin").value, lieu: $("resaLieu").value,
           terrains, terrain: terrains[0] || "", joueurs: [...joueursChoisis], note: $("resaNote").value.trim() };
}
function viderFormulaire(){
  ["resaNote","resaAutre"].forEach(id => { $(id).value = ""; });
  noteAuto = true;
  const d = new Date(); d.setDate(d.getDate() + DEFAUT.jour);
  $("resaDate").value = iso(d);
  $("resaHeure").value = DEFAUT.heure;
  dureeChoisie = DUREE_DEFAUT; majFinAuto();
  let lieu = ""; try{ lieu = localStorage.getItem(CLE_LIEU) || ""; }catch(e){}
  $("resaLieu").value = LIEUX.some(l => l.nom === lieu) ? lieu : (LIEUX.some(l => l.nom === DEFAUT.lieu) ? DEFAUT.lieu : "");
  joueursChoisis = DEFAUT.joueurs.filter(j => membres().includes(j)); terrainsChoisis = [];
  rendreChoixJoueurs(); erreurResa("");
}
function valider(r){
  if(!r.date) return "Choisis une date.";
  { const max = new Date(); max.setDate(max.getDate() + JOURS_AVANCE);
    if(r.date < isoAuj) return "Cette date est déjà passée.";
    if(r.date > iso(max)) return `On ne peut réserver que ${JOURS_AVANCE} jours d'avance.`; }
  if(!r.heure) return "Choisis l'heure de début.";
  if(r.fin && minutesEntre(r.heure, r.fin) <= 0) return "L'heure de fin doit être après le début.";
  if(!r.lieu) return "Choisis un lieu.";
  if(!r.joueurs.length) return "Choisis au moins un joueur.";
  return "";
}

function carteResa(r){
  const el = document.createElement("article"); el.className = "item-resa";
  const n = (r.joueurs || []).length;
  el.innerHTML = `<div class="cm-bandeau"><span class="cm-titre">Match de Pickleball</span><span class="cm-icone">${iconeSVG()}</span></div>
    <div class="cm-corps"><div class="cm-date"></div><div class="cm-heure"></div>
    <div class="cm-lieu"><i></i><span></span></div>
    <div class="cm-label"></div><div class="cm-joueurs"></div>${r.note ? '<div class="cm-note"></div>' : ""}</div>`;
  const date = el.querySelector(".cm-date"), heure = el.querySelector(".cm-heure");
  date.textContent = dateLisible(r.date) || "Date à choisir"; date.classList.toggle("cm-vide", !r.date);
  heure.textContent = plageHoraire(r.heure, r.fin) || "Heure à choisir"; heure.classList.toggle("cm-vide", !r.heure);
  el.querySelector(".cm-lieu span").textContent = [r.lieu, texteTerrains(r)].filter(Boolean).join("  ·  ") || "Lieu à choisir";
  el.querySelector(".cm-label").textContent = `${n > 1 ? "JOUEURS CONFIRMÉS" : "JOUEUR CONFIRMÉ"} (${n})`;
  const zj = el.querySelector(".cm-joueurs"); (r.joueurs || []).forEach(j => { const sp = document.createElement("span"); sp.textContent = j; zj.appendChild(sp); });
  if(r.note) el.querySelector(".cm-note").textContent = r.note;
  el.classList.add("cliquable");
  el.tabIndex = 0; el.setAttribute("role", "button");
  el.setAttribute("aria-label", "Copier l'image de cette réservation");
  el.title = "Copier l'image";
  el.addEventListener("click", () => copierImage(r));
  el.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); copierImage(r); } });
  return el;
}

/* ===================== ICÔNE PICKLEBALL ===================== */
/* Pagaie « aux couleurs UL » + balle trouée, en coordonnées 0-100.
   Chaque forme sert à la fois au SVG de la page et au dessin de l'image copiée. */
const rr = (x, y, w, h, r) => `M${x+r} ${y}H${x+w-r}A${r} ${r} 0 0 1 ${x+w} ${y+r}V${y+h-r}A${r} ${r} 0 0 1 ${x+w-r} ${y+h}H${x+r}A${r} ${r} 0 0 1 ${x} ${y+h-r}V${y+r}A${r} ${r} 0 0 1 ${x+r} ${y}Z`;
const rond = (cx, cy, r) => `M${cx-r} ${cy}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0Z`;
const ICONE = (() => {
  const P = [];   // tourne : true = fait partie de la pagaie inclinée
  P.push({ d:"M45 58L55 58L54.5 66L45.5 66Z", fill:"#1E1B19", tourne:true });                       // gorge
  P.push({ d:rr(45, 63, 10, 28, 3), fill:"#1E1B19", tourne:true });                                 // manche
  P.push({ d:[0,1,2,3,4].map(i => `M45 ${67+i*5}L55 ${64+i*5}`).join(""), stroke:"#4A4542", sw:1.6, tourne:true }); // grip
  P.push({ d:rr(43, 88, 14, 7, 3.5), fill:"#FFFFFF", tourne:true });                                // embout
  P.push({ d:"M45 4H55A16 16 0 0 1 71 20V50A11 11 0 0 1 60 61H40A11 11 0 0 1 29 50V20A16 16 0 0 1 45 4Z", fill:"#FFC103", stroke:"#FFFFFF", sw:4.5, tourne:true }); // face
  P.push({ d:"M47 10H53A11 11 0 0 1 64 21V48A7 7 0 0 1 57 55H43A7 7 0 0 1 36 48V21A11 11 0 0 1 47 10Z", fill:"#FFD54A", tourne:true }); // panneau
  P.push({ d:rr(31.5, 42, 37, 6, 0), fill:"#A6000E", tourne:true });                                 // bande rouge
  P.push({ d:"M2 36l8 -4M4 44l7 -4", stroke:"#FFFFFF", sw:2.5, cap:"round", opacite:.8 });            // traits de vitesse
  P.push({ d:rond(19, 24, 13), fill:"#DFF03A", stroke:"#1E1B19", sw:1.3 });                          // balle
  [[0,0],[0,-.55],[.48,-.28],[.48,.28],[0,.55],[-.48,.28],[-.48,-.28]].forEach(([x, y]) =>
    P.push({ d:rond(19 + x*13, 24 + y*13, 1.7), fill:"#7E8700" }));                                  // trous
  return { formes:P, rotation:30, centre:[50, 50] };
})();
function iconeSVG(){
  const forme = f => `<path d="${f.d}" fill="${f.fill || "none"}"${f.stroke ? ` stroke="${f.stroke}" stroke-width="${f.sw}"` : ""}${f.cap ? ` stroke-linecap="${f.cap}"` : ""}${f.opacite ? ` opacity="${f.opacite}"` : ""}/>`;
  const [cx, cy] = ICONE.centre;
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(${ICONE.rotation} ${cx} ${cy})">${ICONE.formes.filter(f => f.tourne).map(forme).join("")}</g>${ICONE.formes.filter(f => !f.tourne).map(forme).join("")}</svg>`;
}
function dessinerIcone(ctx, x, y, taille){
  const k = taille / 100, [cx, cy] = ICONE.centre;
  const peindre = f => {
    const p = new Path2D(f.d);
    ctx.globalAlpha = f.opacite || 1;
    if(f.fill){ ctx.fillStyle = f.fill; ctx.fill(p); }
    if(f.stroke){ ctx.strokeStyle = f.stroke; ctx.lineWidth = f.sw; ctx.lineCap = f.cap || "butt"; ctx.stroke(p); }
    ctx.globalAlpha = 1;
  };
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(ICONE.rotation * Math.PI / 180); ctx.translate(-cx, -cy);
  ICONE.formes.filter(f => f.tourne).forEach(peindre);
  ctx.restore();
  ICONE.formes.filter(f => !f.tourne).forEach(peindre);
  ctx.restore();
}

/* ===================== IMAGE DE LA RÉSERVATION ===================== */
async function chargerPolices(){
  try{
    await Promise.all([
      document.fonts.load('700 56px "Barlow Condensed"'), document.fonts.load('600 40px "Barlow Condensed"'),
      document.fonts.load('700 30px "Source Sans 3"'), document.fonts.load('600 30px "Source Sans 3"'),
      document.fonts.load('italic 400 26px "Source Sans 3"')
    ]);
  }catch(e){}
}
function decouperLignes(ctx, texte, largeur){
  const lignes = [];
  String(texte || "").split("\n").forEach(par => {
    let ligne = "";
    par.split(" ").forEach(mot => {
      const essai = ligne ? ligne + " " + mot : mot;
      if(ctx.measureText(essai).width > largeur && ligne){ lignes.push(ligne); ligne = mot; }
      else ligne = essai;
    });
    lignes.push(ligne);
  });
  return lignes;
}
function rectArrondi(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
/* Dessine la carte ; si ctx est null, calcule seulement la hauteur */
function dessinerResa(ctx, mesure, r, W){
  const PAD = 48, F_T = '"Barlow Condensed","Arial Narrow",Arial,sans-serif', F_X = '"Source Sans 3","Segoe UI",Arial,sans-serif';
  const C = { rouge:"#E30513", fonce:"#A6000E", or:"#FFC103", orFonce:"#C99400", orPale:"#FFF4CC", texte:"#1E1B19", texte2:"#5E5853", gris:"#F7F5F2" };
  const d = ctx || mesure;
  let y = 0;
  // Bandeau
  if(ctx){
    ctx.fillStyle = C.rouge; ctx.fillRect(0, 0, W, 118);
    ctx.fillStyle = C.or; ctx.fillRect(0, 118, W, 10);
    ctx.fillStyle = "#fff"; ctx.font = `700 58px ${F_T}`; ctx.textBaseline = "alphabetic";
    ctx.fillText("Match de Pickleball", PAD, 80);
    dessinerIcone(ctx, W - PAD - 104, 8, 104);
  }
  y = 128 + 64;
  // Date et heure
  d.font = `700 50px ${F_T}`;
  if(ctx){ ctx.fillStyle = C.texte; ctx.fillText(dateLisible(r.date) || "Date à choisir", PAD, y); }
  y += 50;
  d.font = `600 42px ${F_T}`;
  if(ctx){ ctx.fillStyle = C.fonce; ctx.fillText((plageHoraire(r.heure, r.fin) || "Heure à choisir").replace(/\u00a0/g, " "), PAD, y); }
  y += 30;
  // Lieu et terrains
  const lieu = [r.lieu, texteTerrains(r)].filter(Boolean).join("  ·  ") || "Lieu à choisir";
  d.font = `700 30px ${F_X}`;
  const lw = d.measureText(lieu).width + 64;
  if(ctx){
    rectArrondi(ctx, PAD, y, lw, 56, 28); ctx.fillStyle = C.gris; ctx.fill();
    ctx.fillStyle = C.rouge; ctx.beginPath(); ctx.arc(PAD + 28, y + 28, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.texte; ctx.fillText(lieu, PAD + 46, y + 38);
  }
  y += 56 + 40;
  // Joueurs
  const joueurs = r.joueurs || [];
  d.font = `700 22px ${F_X}`;
  if(ctx){ ctx.fillStyle = C.texte2; ctx.fillText(`${joueurs.length > 1 ? "JOUEURS CONFIRMÉS" : "JOUEUR CONFIRMÉ"} (${joueurs.length})`, PAD, y); }
  y += 18;
  d.font = `600 30px ${F_X}`;
  let x = PAD; const hP = 54, gap = 12;
  joueurs.forEach(j => {
    const w = d.measureText(j).width + 44;
    if(x + w > W - PAD && x > PAD){ x = PAD; y += hP + gap; }
    if(ctx){
      rectArrondi(ctx, x, y, w, hP, 27); ctx.fillStyle = C.orPale; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = C.orFonce; ctx.stroke();
      ctx.fillStyle = C.texte; ctx.fillText(j, x + 22, y + 37);
    }
    x += w + gap;
  });
  y += (joueurs.length ? hP : 0) + 36;
  // Note
  if(r.note){
    d.font = `italic 400 28px ${F_X}`;
    const lignes = decouperLignes(d, r.note, W - 2 * PAD - 48), hL = 38, hB = lignes.length * hL + 36;
    if(ctx){
      rectArrondi(ctx, PAD, y, W - 2 * PAD, hB, 14); ctx.fillStyle = C.gris; ctx.fill();
      ctx.fillStyle = C.rouge; ctx.fillRect(PAD, y, 6, hB);
      ctx.fillStyle = C.texte2; lignes.forEach((l, i) => ctx.fillText(l, PAD + 30, y + 44 + i * hL));
    }
    y += hB + 36;
  }
  return y + 12;
}
async function imageResa(r){
  await chargerPolices();
  const W = 900, ECH = 2;
  const mesure = document.createElement("canvas").getContext("2d");
  const H = dessinerResa(null, mesure, r, W);
  const cv = document.createElement("canvas"); cv.width = W * ECH; cv.height = H * ECH;
  const ctx = cv.getContext("2d"); ctx.scale(ECH, ECH);
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, H);
  dessinerResa(ctx, null, r, W);
  ctx.fillStyle = "#FFC103"; ctx.fillRect(0, H - 8, W, 8);
  return new Promise(res => cv.toBlob(res, "image/png"));
}
async function copierImage(r){
  const promesse = imageResa(r);
  try{
    if(!navigator.clipboard || !window.ClipboardItem) throw new Error("non pris en charge");
    await navigator.clipboard.write([new ClipboardItem({ "image/png": promesse })]);
    message("Image copiée ! Colle-la dans ta conversation.");
    return;
  }catch(e){}
  const blob = await promesse;
  const fichier = new File([blob], `pickleball-${r.date || "match"}.png`, { type: "image/png" });
  try{
    if(navigator.canShare && navigator.canShare({ files: [fichier] })){ await navigator.share({ files: [fichier] }); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fichier.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  message("L'image a été téléchargée.");
}

function rendreApercu(){
  const zone = $("resaApercuCarte"); if(!zone) return;
  zone.innerHTML = "";
  const r = lireFormulaire();
  majPucesDate();
  if(!(r.date || r.heure || r.lieu || r.joueurs.length || r.note)) return;
  const cadre = document.createElement("div"); cadre.className = "apercu-cadre";
  cadre.innerHTML = '<span class="etiquette-apercu">Aperçu · pas encore enregistrée</span>';
  cadre.appendChild(carteResa(r));
  zone.appendChild(cadre);
}
const fmtJourLong = new Intl.DateTimeFormat("fr-CA",{ weekday:"long" });
const fmtJourCourt = new Intl.DateTimeFormat("fr-CA",{ weekday:"short" });
const majuscule = t => t.charAt(0).toUpperCase() + t.slice(1);
function majPucesDate(){
  const v = $("resaDate").value, h = $("resaHeure").value;
  const auj = new Date(), max = new Date(); max.setDate(max.getDate() + JOURS_AVANCE);
  $("resaDate").min = iso(auj); $("resaDate").max = iso(max);
  document.querySelectorAll("[data-jour]").forEach(b => {
    const n = Number(b.dataset.jour), d = new Date(); d.setDate(d.getDate() + n);
    if(n > 0){
      const long = `${majuscule(fmtJourLong.format(d))} ${d.getDate()}`;
      const court = `${majuscule(fmtJourCourt.format(d)).replace(/\.$/, "")} ${d.getDate()}`;
      b.innerHTML = `<span class="long">${long}</span><span class="court">${court}</span>`;
    } else b.innerHTML = `<span class="long">Aujourd'hui</span><span class="court">Auj.</span>`;
    b.setAttribute("aria-pressed", String(v === iso(d)));
  });
  document.querySelectorAll("[data-heure]").forEach(b => b.setAttribute("aria-pressed", String(h === b.dataset.heure)));
  const f = $("resaFin").value;
  document.querySelectorAll("[data-duree]").forEach(b => b.setAttribute("aria-pressed", String(!!(h && f) && minutesEntre(h, f) === Number(b.dataset.duree))));
}

function rendreResa(){
  rendreChoixJoueurs();
  const zone = $("listeResa"); zone.innerHTML = "";
  const avenir = (donnees.reservations || []).filter(r => r.date >= isoAuj).sort((a,b) => (a.date + a.heure).localeCompare(b.date + b.heure));
  if(!avenir.length){ zone.innerHTML = `<div class="vide">Aucune réservation enregistrée à venir.</div>`; return; }
  avenir.forEach(r => {
    const ligne = document.createElement("div"); ligne.className = "ligne-resa";
    const el = carteResa(r);
    const suppr = document.createElement("button");
    suppr.type = "button"; suppr.className = "suppr-resa seul-edition";
    suppr.setAttribute("aria-label", "Supprimer cette réservation"); suppr.title = "Supprimer cette réservation";
    suppr.innerHTML = `<span aria-hidden="true">🗑</span><span class="txt">Supprimer</span>`;
    ligne.append(el, suppr);
    suppr.onclick = async () => {
      if(!exigerEdition()) return;
      const ok = await dialogue({ titre:"Supprimer cette réservation ?", texte:`${dateLisible(r.date)}, ${plageHoraire(r.heure, r.fin)}`, ok:"Supprimer" });
      if(!ok) return;
      donnees.reservations = (donnees.reservations || []).filter(x => x.id !== r.id);
      sauver(); rendre();
    };
    zone.appendChild(ligne);
  });
}

(function(){
  $("resaLieu").add(new Option("Choisis un lieu", ""));
  LIEUX.forEach(l => $("resaLieu").add(new Option(`${l.nom} (${l.terrains} terrains)`, l.nom)));
  $("resaLieu").addEventListener("change", () => {
    const lieu = lieuChoisi();
    if(lieu && joueursChoisis.length > lieu.terrains * JOUEURS_PAR_TERRAIN)
      erreurResa(`${lieu.nom} n'a que ${lieu.terrains} terrains : retire des joueurs.`);
    else erreurResa("");
    terrainsChoisis = terrainsChoisis.filter(t => !lieu || Number(t) <= lieu.terrains);
    rendreTerrains();
  });
  $("resaDate").addEventListener("input", () => { erreurResa(""); rendreApercu(); });
  $("resaNote").addEventListener("input", () => {
    noteAuto = $("resaNote").value === texteNoteAuto(joueursChoisis.length);
    $("resaNoteAuto").hidden = noteAuto;
    erreurResa(""); rendreApercu();
  });
  $("resaNoteAuto").onclick = () => { noteAuto = true; majNoteAuto(); rendreApercu(); };
  ["input","change"].forEach(ev => $("resaHeure").addEventListener(ev, () => { majFinAuto(); erreurResa(""); rendreApercu(); }));
  ["input","change"].forEach(ev => $("resaFin").addEventListener(ev, () => { dureeChoisie = null; erreurResa(""); rendreApercu(); }));
  document.querySelectorAll("[data-duree]").forEach(b => b.onclick = () => {
    dureeChoisie = Number(b.dataset.duree);
    if(!$("resaHeure").value){ erreurResa("Choisis d'abord l'heure de début."); return; }
    majFinAuto(); erreurResa(""); rendreApercu();
  });
  $("resaDate").addEventListener("change", rendreApercu);
  document.querySelectorAll("[data-heure]").forEach(b => b.onclick = () => { $("resaHeure").value = b.dataset.heure; majFinAuto(); erreurResa(""); rendreApercu(); });
  document.querySelectorAll("[data-jour]").forEach(b => b.onclick = () => {
    const d = new Date(); d.setDate(d.getDate() + Number(b.dataset.jour));
    $("resaDate").value = iso(d); erreurResa(""); rendreApercu();
  });
  $("resaAjouterAutre").onclick = ajouterMembre;
  $("resaAutre").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); ajouterMembre(); } });
  $("resaRetirer").onclick = retirerMembres;
  $("resaVider").onclick = viderFormulaire;
  $("resaEnregistrer").onclick = () => {
    const r = lireFormulaire(), err = valider(r);
    if(err){ erreurResa(err); return; }
    const lieu = lieuChoisi();
    if(lieu && r.joueurs.length > lieu.terrains * JOUEURS_PAR_TERRAIN){ erreurResa(`${lieu.nom} n'a que ${lieu.terrains} terrains : retire des joueurs.`); return; }
    if(!exigerEdition()) return;
    if(!Array.isArray(donnees.reservations)) donnees.reservations = [];
    const limite = new Date(); limite.setDate(limite.getDate() - 30);
    donnees.reservations = donnees.reservations.filter(x => x.date >= iso(limite));   // on garde 30 jours d'historique
    donnees.reservations.push({ id: "r" + Date.now().toString(36), ...r });
    try{ localStorage.setItem(CLE_LIEU, r.lieu); }catch(e){}
    sauver(); rendre();
    message("Réservation enregistrée.");
    viderFormulaire();
  };
})();

/* ===================== DÉMARRAGE ===================== */
donnees = lireLocal() || depart();
viderFormulaire();
function rendre(){
  document.body.classList.toggle("lecture", !modeEdition);
  rendreResa();
}
rendre();
brancherSynchro();
